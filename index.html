<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<meta name="description" content="Search software across Flathub, F-Droid and WinGet.">
<title>ValoStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f5f7fb;--muted:#9da6b5;--line:rgba(255,255,255,.12);--soft:#11151c;--blue:#7aa7ff;--green:#6fd0a0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#05070b;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.page{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 0%,#0e2744 0%,#071426 28%,#030811 68%,#02050a 100%)}
.mast{position:relative;z-index:5;padding:26px 28px 0;display:flex;justify-content:center}
.wordmark{font-size:18px;font-weight:800;letter-spacing:-.7px}
.wordmark span{color:var(--blue)}
.main{width:100%;margin:0;padding:0;position:relative;z-index:2;flex:1}
.hero{position:relative;min-height:calc(100vh - 72px);width:100%;display:flex;align-items:center;justify-content:center;text-align:center;isolation:isolate;overflow:hidden;padding:0 24px}.hero-content{position:relative;z-index:3;width:min(820px,100%);display:flex;justify-content:center}.light-rays{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.light-rays canvas{display:block;width:100%;height:100%}
.hero h1{display:none}
.search-pill{height:72px;width:min(820px,100%);display:flex;align-items:center;gap:16px;padding:0 23px;border:1px solid rgba(255,255,255,.78);border-radius:999px;background:rgba(255,255,255,.18);box-shadow:0 16px 48px rgba(20,30,45,.13),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(120,140,160,.16);backdrop-filter:blur(15px) saturate(150%);-webkit-backdrop-filter:blur(15px) saturate(150%);position:relative;overflow:hidden;transition:.22s ease;isolation:isolate}.search-pill .glass-noise{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.7;mix-blend-mode:soft-light}.search-pill .glass-sheen{position:absolute;inset:1px;z-index:0;pointer-events:none;border-radius:inherit;background:radial-gradient(120% 180% at 12% 0%,rgba(255,255,255,.78),transparent 34%),linear-gradient(110deg,rgba(255,255,255,.34),transparent 38%,rgba(255,255,255,.16) 70%,rgba(255,255,255,.46));box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.search-pill:before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.2),transparent 55%,rgba(255,255,255,.08));pointer-events:none;z-index:1}.search-pill>*:not(.glass-noise):not(.glass-sheen){position:relative;z-index:2}.search-pill:focus-within{border-color:rgba(130,145,160,.62);box-shadow:0 14px 42px rgba(20,30,45,.14),inset 0 1px 0 rgba(255,255,255,.95)}
.search-icon{width:24px;height:24px;flex:none;color:#888}
.search-pill input{border:0;outline:0;background:transparent;width:100%;font-size:19px;color:#f5f7fb;min-width:0}
.search-pill input::placeholder{color:#999}
.key{font-size:11px;color:#999;border:1px solid var(--line);border-radius:7px;padding:5px 8px;white-space:nowrap}
.hint{display:none}
.results{margin-top:56px;display:none}
.results.visible{display:block}
.results-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:17px}
.results-head h2{margin:0;font-size:13px;font-weight:600;color:#777}
.results-head span{font-size:12px;color:#aaa}
.result-list{border-top:1px solid var(--line)}
.result{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:18px;align-items:center;padding:21px 4px;border-bottom:1px solid var(--line);transition:.12s}
.result:hover{background:rgba(255,255,255,.045)}
.icon{width:64px;height:64px;border-radius:15px;overflow:hidden;background:#151a23;display:grid;place-items:center}
.icon img{width:100%;height:100%;object-fit:cover}
.icon-fallback{font-size:23px;font-weight:700;color:#777}
.name{font-size:17px;font-weight:700;letter-spacing:-.35px;margin-bottom:5px}
.summary{font-size:12px;line-height:1.5;color:#777;max-width:650px}
.ids{margin-top:7px;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sources{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap;max-width:310px}
.source{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:8px 11px;background:rgba(255,255,255,.055);color:#dfe5ef;font-size:11px;font-weight:600;white-space:nowrap}
.source i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.source .platform{font-weight:400;color:#999}
.source:hover{border-color:#bbb}
.empty{text-align:center;color:#888;padding:55px 20px;border-bottom:1px solid var(--line);font-size:13px}
.empty strong{display:block;color:#333;margin-bottom:5px}
.detail{display:none;margin-top:56px;border-top:1px solid var(--line);padding-top:25px}
.detail.open{display:block}
.detail-top{display:flex;gap:15px;align-items:center}
.detail-icon{width:58px;height:58px;border-radius:14px;overflow:hidden;background:#151a23}
.detail-icon img{width:100%;height:100%;object-fit:cover}
.detail-title h2{margin:0 0 4px;font-size:21px;letter-spacing:-.6px}
.detail-title p{margin:0;color:#777;font-size:12px}
.detail-sources{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.detail-source{border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:170px}
.detail-source strong{display:block;font-size:12px;margin-bottom:4px}
.detail-source small{display:block;color:#999;font-size:10px;margin-bottom:10px}
.install{display:block;background:#181818;color:#fff;border-radius:9px;padding:10px 11px;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;overflow:auto}
.install.none{background:#11151c;color:#8f98a7}
.detail-actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.action{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:rgba(255,255,255,.05);color:#e7ebf2}
.footer{display:none}
@media(max-width:650px){
.mast{padding:20px 18px 0}.main{width:100%;padding:0}
.hero{min-height:calc(100vh - 62px);padding:0 18px}
.hero h1{display:none}
.search-pill{height:62px;padding:0 18px;gap:12px;width:100%}.search-pill input{font-size:16px}.key{display:none}
.results{margin-top:40px}.result{grid-template-columns:48px minmax(0,1fr);gap:13px;padding:17px 0}.icon{width:48px;height:48px;border-radius:12px}.sources{grid-column:2;justify-content:flex-start;max-width:none;margin-top:-3px}.source{padding:7px 9px}
.ids{display:none}.summary{font-size:11px}.name{font-size:15px}
.detail{margin-top:40px}.detail-source{min-width:0;width:100%}
.footer{font-size:9px}
}
</style>
</head>
<body>
<div class="page">
<header class="mast"><a class="wordmark" href="./">valo<span>store</span></a></header>
<main class="main">
<section class="hero">
<div class="light-rays" aria-hidden="true"><canvas id="lightRays"></canvas></div>
<div class="hero-content">
<label class="search-pill">
<canvas class="glass-noise" id="glassNoise" aria-hidden="true"></canvas><span class="glass-sheen" aria-hidden="true"></span>
<svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
<input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Search software…" aria-label="Search software">
</label>
</div>
</section>
<section class="results" id="results" aria-live="polite">
<div class="results-head"><h2 id="resultTitle">Results</h2><span id="resultCount"></span></div>
<div class="result-list" id="resultList"></div>
</section>
<section class="detail" id="detail"></section>
</main>
</div>
<script src="./app.js"></script>
<script src="./effects.js"></script>
</body>
</html>

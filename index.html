<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101c">
<meta name="description" content="Search software across Flathub, F-Droid and WinGet.">
<title>ValoStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #07101c;
  --surface: #101b2a;
  --surface-hover: #142235;
  --text: #edf2f8;
  --muted: #91a0b3;
  --dim: #718096;
  --line: #253448;
  --accent: #78aef0;
  --green: #73c9a1;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); }
body {
  margin: 0;
  min-height: 100%;
  color: var(--text);
  background: var(--bg);
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  overscroll-behavior-x: none;
}
button, input { font: inherit; }
a { color: inherit; text-decoration: none; }
.page {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100svh;
  min-height: 100dvh;
  isolation: isolate;
  background:
    radial-gradient(900px 560px at 50% 0%, rgba(27, 66, 108, .25), transparent 72%),
    linear-gradient(180deg, #091523 0%, #07101c 56%, #060d17 100%);
}
.mast {
  flex: 0 0 64px;
  height: 64px;
  display: grid;
  place-items: center;
  padding: 0 18px;
}
.wordmark {
  display: inline-block;
  color: #f2f5fa;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -.8px;
  line-height: 1;
}
.wordmark span { color: var(--accent); }
.main {
  width: min(920px, calc(100% - 40px));
  min-width: 0;
  margin: 0 auto;
  flex: 1 0 auto;
  display: flex;
  flex-direction: column;
}
.hero {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  min-height: calc(100vh - 64px);
  min-height: calc(100svh - 64px);
  min-height: calc(100dvh - 64px);
  padding: 24px 0;
}
.hero-content {
  width: min(760px, 100%);
  min-width: 0;
}
.search-pill {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  height: 66px;
  gap: 15px;
  padding: 0 22px;
  border: 1px solid #304259;
  border-radius: 999px;
  background: #101b2a;
  box-shadow: none;
  transition: border-color .16s ease, background-color .16s ease;
}
.search-pill:focus-within {
  border-color: #659bd5;
  background: #111e30;
  box-shadow: 0 0 0 3px rgba(83, 142, 205, .13);
}
.search-icon {
  display: block;
  flex: 0 0 22px;
  width: 22px;
  height: 22px;
  color: #8da2ba;
}
.search-pill input {
  display: block;
  width: 100%;
  min-width: 0;
  height: 100%;
  border: 0;
  outline: 0;
  padding: 0;
  color: var(--text);
  background: transparent;
  font-size: 18px;
  font-weight: 400;
  appearance: none;
  -webkit-appearance: none;
}
.search-pill input::placeholder { color: #8290a3; opacity: 1; }
.search-pill input::-webkit-search-decoration,
.search-pill input::-webkit-search-cancel-button,
.search-pill input::-webkit-search-results-button,
.search-pill input::-webkit-search-results-decoration { -webkit-appearance: none; }
.results {
  display: none;
  min-width: 0;
  margin: 0 0 64px;
  padding: 0 0 24px;
}
.results.visible { display: block; }
.results-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin: 0 0 14px;
}
.results-head h2 {
  margin: 0;
  color: #dfe7f1;
  font-size: 14px;
  line-height: 1.4;
  font-weight: 650;
}
.results-head span { color: var(--dim); font-size: 12px; }
.result-list { border-top: 1px solid var(--line); }
.result {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr) auto;
  align-items: center;
  gap: 15px;
  min-width: 0;
  padding: 17px 2px;
  border-bottom: 1px solid var(--line);
}
.result:hover { background: rgba(255,255,255,.018); }
.icon {
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  overflow: hidden;
  border-radius: 12px;
  background: #142033;
  color: #c4d0df;
}
.icon img { display: block; width: 100%; height: 100%; object-fit: cover; }
.icon-fallback { font-size: 21px; font-weight: 700; }
.result-copy { min-width: 0; }
.name {
  margin: 0 0 5px;
  color: #edf2f8;
  font-size: 15px;
  line-height: 1.3;
  font-weight: 650;
}
.summary {
  max-width: 650px;
  color: #91a0b3;
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.ids {
  margin-top: 6px;
  color: #718096;
  font: 10px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
  overflow-wrap: anywhere;
}
.sources {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  max-width: 300px;
}
.source {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 9px;
  border: 1px solid #2b3b50;
  border-radius: 999px;
  background: #101b2a;
  color: #d5deea;
  font-size: 10px;
  line-height: 1;
  font-weight: 600;
  white-space: nowrap;
}
.source i { width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: var(--green); }
.source .platform { color: #91a0b3; font-weight: 400; }
.source:hover { border-color: #5d7898; }
.empty {
  padding: 34px 12px;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  text-align: center;
  font-size: 13px;
  line-height: 1.55;
}
.empty strong { display: block; margin-bottom: 4px; color: #e5ebf4; font-weight: 600; }
.result-detail {
  display: none;
  grid-column: 1 / -1;
  min-width: 0;
  padding: 17px 2px 2px;
  border-top: 1px solid var(--line);
}
.result-detail.open { display: block; }
.detail-top { display: flex; align-items: center; gap: 12px; min-width: 0; }
.detail-icon {
  display: grid;
  place-items: center;
  flex: 0 0 48px;
  width: 48px;
  height: 48px;
  overflow: hidden;
  border-radius: 10px;
  background: #142033;
}
.detail-icon img { display: block; width: 100%; height: 100%; object-fit: cover; }
.detail-title { min-width: 0; }
.detail-title h3 { margin: 0 0 4px; font-size: 16px; font-weight: 650; }
.detail-title p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
.detail-sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 9px; margin-top: 16px; }
.detail-source { min-width: 0; padding: 12px; border: 1px solid #29394e; border-radius: 10px; background: #0c1725; }
.detail-source strong { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 650; }
.detail-source small { display: block; margin-bottom: 10px; color: var(--muted); font-size: 10px; overflow-wrap: anywhere; }
.install {
  display: block;
  max-width: 100%;
  padding: 9px 10px;
  border-radius: 6px;
  overflow-x: auto;
  background: #07101c;
  color: #d5e0ee;
  font: 10px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.install.none { color: #9aa8ba; }
.detail-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.action {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  padding: 7px 9px;
  border: 1px solid #304259;
  border-radius: 7px;
  background: #132034;
  color: #dce6f1;
  font-size: 10px;
  font-weight: 600;
}
.action:hover { border-color: #6b8fb8; }
.page.has-query .mast { display: none; }
.page.has-query .hero {
  position: sticky;
  top: 0;
  z-index: 20;
  min-height: 76px;
  height: 76px;
  padding: 10px 0;
  justify-content: center;
  background: #07101c;
  border-bottom: 1px solid #1d2a3b;
}
.page.has-query .hero-content { width: 100%; }
.page.has-query .search-pill { height: 54px; max-width: 760px; }
.page.has-query .results { margin-top: 22px; }
@media (max-width: 680px) {
  .mast { flex-basis: 58px; height: 58px; }
  .main { width: calc(100% - 32px); }
  .hero { min-height: calc(100vh - 58px); min-height: calc(100svh - 58px); min-height: calc(100dvh - 58px); }
  .search-pill { height: 60px; padding: 0 18px; gap: 12px; }
  .search-pill input { font-size: 16px; }
  .page.has-query .hero { height: 68px; min-height: 68px; padding: 7px 0; }
  .page.has-query .search-pill { height: 54px; }
  .page.has-query .results { margin-top: 17px; }
  .result { grid-template-columns: 46px minmax(0, 1fr); gap: 11px; padding: 14px 0; }
  .icon { width: 46px; height: 46px; border-radius: 10px; }
  .sources { grid-column: 2; justify-content: flex-start; max-width: none; margin-top: -2px; }
  .source { padding: 7px 8px; }
  .ids { display: none; }
  .summary { font-size: 11px; }
  .name { font-size: 14px; }
  .result-detail { padding-top: 14px; }
  .detail-sources { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="page">
  <header class="mast">
    <a class="wordmark" href="./" aria-label="ValoStore home">valo<span>store</span></a>
  </header>
  <main class="main">
    <section class="hero" aria-label="Software search">
      <div class="hero-content">
        <label class="search-pill">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path>
          </svg>
          <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Search software..." aria-label="Search software">
        </label>
      </div>
    </section>
    <section class="results" id="results" aria-live="polite">
      <div class="results-head"><h2 id="resultTitle">Software</h2><span id="resultCount"></span></div>
      <div class="result-list" id="resultList"></div>
    </section>
  </main>
</div>
<script src="./app.js" defer></script>
</body>
</html>

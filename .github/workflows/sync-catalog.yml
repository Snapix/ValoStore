name: Sync software catalogue

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/catalog.json"
      - "data/search-index.json"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valostore-catalogue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull F-Droid and Flathub metadata
        run: python scripts/sync_catalog.py

      - name: Validate generated JSON
        run: |
          python -m json.tool data/catalog.json >/dev/null
          python -m json.tool data/search-index.json >/dev/null

      - name: Check catalogue is not empty
        run: |
          python - <<'PY'
          import json
          with open("data/catalog.json", encoding="utf-8") as f:
              data=json.load(f)
          assert data["counts"]["fdroid"] >= 1000
          assert data["counts"]["flathub"] >= 500
          assert data["counts"]["total"] >= 1500
          print(data["counts"])
          PY

      - name: Publish changed catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/search-index.json
          if git diff --cached --quiet; then
            echo "Catalogue unchanged."
            exit 0
          fi
          git commit -m "Sync upstream software catalogue"
          git push
